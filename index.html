<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f0e5">
<title>رسالة من أبيك السماوي</title>
<style>
:root{--ink:#44372d;--gold:#b18a4d;--paper:#fffdf8;--muted:#8c7b69}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 0%,#fffaf0 0,#f4eadb 52%,#eadcc8 100%);display:flex;align-items:center;justify-content:center;padding:22px}
main{width:min(100%,650px);text-align:center}
.mark{font-size:34px;color:var(--gold);margin-bottom:8px}
h1{font-size:clamp(27px,6vw,39px);font-weight:600;margin:0 0 10px}
.sub{color:var(--muted);font-size:15px;line-height:1.9;margin:0 auto 26px;max-width:440px}
.panel{background:rgba(255,253,248,.92);border:1px solid #e6d7c1;border-radius:25px;padding:clamp(22px,5vw,38px);box-shadow:0 16px 45px #715b3a1c;min-height:280px;display:flex;flex-direction:column;justify-content:center}
.prompt{color:var(--gold);font-size:14px;letter-spacing:.2px;margin-bottom:15px}
.message{font-size:clamp(20px,4.7vw,27px);line-height:2;font-weight:600;margin:0 0 24px}
.sep{height:1px;background:linear-gradient(90deg,transparent,#d8c39f,transparent);margin:0 0 20px}
.verse-label{font-size:14px;color:var(--gold);margin-bottom:9px}
.verse{font-size:clamp(16px,3.8vw,20px);line-height:2;margin:0 0 8px}
.ref{font-size:14px;color:var(--muted)}
button{margin:23px auto 0;border:0;border-radius:999px;padding:16px 34px;background:linear-gradient(135deg,#b9965d,#92703d);color:white;font-size:18px;font-weight:bold;font-family:inherit;cursor:pointer;box-shadow:0 8px 20px #8c6a3d38;transition:transform .2s,filter .2s}
button:hover{filter:brightness(1.06);transform:translateY(-2px)}
button:active{transform:scale(.98)}
button:disabled{opacity:.7;cursor:wait}
.note{font-size:12px;color:#9b8a78;margin-top:18px}
.hidden{display:none}
#result{animation:appear .55s ease both}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){#result{animation:none}button{transition:none}}
</style>
</head>
<body>
<main>
  <div class="mark">✝</div>
  <h1>رسالة من أبيك السماوي</h1>
  <p class="sub">اهدأ للحظة… وخد نفس عميق، واضغط لتقرأ رسالة ووعداً من كلمة ربنا ليك النهارده.</p>
  <section class="panel" aria-live="polite">
    <div id="welcome">
      <div class="prompt">رسالة مخصوص ليك</div>
      <p class="message">«لاَ تَخَفْ، لأَنِّي مَعَكَ»</p>
      <div class="sep"></div>
      <p class="ref">اضغط على الزر لتظهر رسالتك ووعدك</p>
    </div>
    <div id="result" class="hidden">
      <div class="prompt" id="number"></div>
      <p class="message" id="message"></p>
      <div class="sep"></div>
      <div class="verse-label">📖 وعد من الكتاب المقدس</div>
      <p class="verse" id="verse"></p>
      <div class="ref" id="reference"></div>
    </div>
  </section>
  <button id="draw" type="button">افتح رسالتك ✨</button>
  <p class="note">كل ضغطة تكشف رسالة عشوائية من الـ50 رسالة.</p>
</main>
<script>
const cards = [{"message": "يا ابني/يا ابنتي، اسمك منقوش على كفّي، ومن المستحيل أن أنساك في أي لحظة.", "verse": "«هُوَذَا عَلَى كَفَّيَّ نَقَشْتُكِ»", "reference": "إشعياء 49:16"}, {"message": "لا تخف من الغد؛ فأنا موجود فيه بالفعل، وأجهّز لك كل ما تحتاجه في وقته.", "verse": "«لاَ تَخَفْ لأَنِّي مَعَكَ. لاَ تَتَلَفَّتْ لأَنِّي إِلهُكَ. قَدْ أَيَّدْتُكَ وَأَعَنْتُكَ»", "reference": "إشعياء 41:10"}, {"message": "أنا لست إلهاً بعيداً يراقبك من السماء، أنا أبوك الذي يركض ليحتضنك كلما رجعت إليّ.", "verse": "«وَإِذْ كَانَ لَمْ يَزَلْ بَعِيدًا رَآهُ أَبُوهُ، فَتَحَنَّنَ وَرَكَضَ وَوَقَعَ عَلَى عُنُقِهِ وَقَبَّلَهُ»", "reference": "لوقا 15:20"}, {"message": "دموعك التي تسقط في الخفاء ليست مجهولة عندي؛ أنا أجمعها في زقّي وأعوضك عنها بفرح حقيقي.", "verse": "«اجْعَلْ أَنْتَ دُمُوعِي فِي زِقِّكَ. أَمَا هِيَ فِي سِفْرِكَ؟»", "reference": "مزمور 56:8"}, {"message": "قيمتك عندي لا تتوقف على نجاحك أو إنجازاتك؛ أنت غالٍ وعزيز في عينيّ لمجرد أنك ابني.", "verse": "«إِذْ صِرْتَ عَزِيزًا فِي عَيْنَيَّ مُكَرَّمًا، وَأَنَا قَدْ أَحْبَبْتُكَ»", "reference": "إشعياء 43:4"}, {"message": "عندما تشعر أن طاقتك قد نفدت، تعالَ واسترح في حضني، فحِمْلي خفيف ونيري هيّن.", "verse": "«تَعَالَوْا إِلَيَّ يَا جَمِيعَ الْمُتْعَبِينَ وَالثَّقِيلِي الأَحْمَالِ، وَأَنَا أُرِيحُكُمْ»", "reference": "متى 11:28"}, {"message": "أنا أرى الصراع الصامت الذي بداخلك، وأمد يدي الآن لأمنحك سلاماً يفوق كل عقل.", "verse": "«سَلاَمًا أَتْرُكُ لَكُمْ. سَلاَمِي أُعْطِيكُمْ... لاَ تَضْطَرِبْ قُلُوبُكُمْ وَلاَ تَرْهَبْ»", "reference": "يوحنا 14:27"}, {"message": "خططك التي تعطلت لم تكن صدفة، بل كانت حمايتي لك من طرق لم تكن في صالحك.", "verse": "«لأَنَّ أَفْكَارِي لَيْسَتْ أَفْكَارَكُمْ، وَلاَ طُرُقُكُمْ طُرُقِي، يَقُولُ الرَّبُّ»", "reference": "إشعياء 55:8"}, {"message": "لا تقارن حياتك بحياة الآخرين؛ لي معك قصة خاصة وتوقيت مثالي لا يشبه أحداً.", "verse": "«لأَنَّنَا نَحْنُ عَمَلُهُ، مَخْلُوقِينَ فِي الْمَسِيحِ يَسُوعَ لأَعْمَال صَالِحَةٍ»", "reference": "أفسس 2:10"}, {"message": "مهما ابتعدت أو ضللت الطريق، باب بيتي مفتوح لك دائماً دون لوم أو عتاب.", "verse": "«وَمَنْ يُقْبِلْ إِلَيَّ فَلاَ أُخْرِجْهُ خَارِجًا»", "reference": "يوحنا 6:37"}, {"message": "أنا أسمع صلاتك حتى حين تعجز الكلمات عن الخروج من فمك؛ أنين قلبك مفهوم عندي.", "verse": "«الرَّبُّ قَرِيبٌ لِكُلِّ الَّذِينَ يَدْعُونَهُ، الَّذِينَ يَدْعُونَهُ بِالْحَقِّ»", "reference": "مزمور 145:18"}, {"message": "لا تحمل همّ كيف ستعبر هذه الأزمة، أنا من يشقّ لك طريقاً في وسط البحر.", "verse": "«إِذَا اجْتَزْتَ فِي الْمِيَاهِ فَأَنَا مَعَكَ، وَفِي الأَنْهَارِ فَلاَ تَغْمُرُكَ»", "reference": "إشعياء 43:2"}, {"message": "في الوقت الذي يراك فيه الناس ضعيفاً، أرى فيك بطلاً أصنع به أموراً عظيمة.", "verse": "«تَكْفِيكَ نِعْمَتِي، لأَنَّ قُوَّتِي فِي الضَّعْفِ تُكْمَلُ»", "reference": "2 كورنثوس 12:9"}, {"message": "أحببتك محبة أبدية، ولهذا أدمت لك الرحمة ولن أتخلى عن عمل يديّ فيك.", "verse": "«مَحَبَّةً أَبَدِيَّةً أَحْبَبْتُكِ، مِنْ أَجْلِ ذلِكَ أَدَمْتُ لَكِ الرَّحْمَةَ»", "reference": "إرميا 31:3"}, {"message": "كل باب أُغلق في وجهك بمرارة، أغلقته بنفسي لأفتح لك باباً أوسع وأليق بك.", "verse": "«هأَنَذَا قَدْ جَعَلْتُ أَمَامَكَ بَابًا مَفْتُوحًا وَلاَ يَسْتَطِيعُ أَحَدٌ أَنْ يُغْلِقَهُ»", "reference": "رؤيا 3:8"}, {"message": "لا تستعجل الإجابة؛ أنا أعمل في الخفاء لأُعدّ لك عطية كاملة تليق بأبوتي لك.", "verse": "«اصْبِرْ لِلرَّبِّ وَانْتَظِرْهُ... وَهُوَ يُعْطِيكَ سُؤْلَ قَلْبِكَ»", "reference": "مزمور 37:4، 7"}, {"message": "عندما يخذلونك وتجد نفسك وحيداً، تذكّر أنني الصديق الألصق من الأخ.", "verse": "«وَهَا أَنَا مَعَكُمْ كُلَّ الأَيَّامِ إِلَى انْقِضَاءِ الدَّهْرِ»", "reference": "متى 28:20"}, {"message": "سقطاتك الماضية لا تحدد مستقبلك؛ دمي يطهرك ويمنحك بداية جديدة كل صباح.", "verse": "«إِنْ كَانَتْ خَطَايَاكُمْ كَالْقِرْمِزِ تَبْيَضُّ كَالثَّلْجِ»", "reference": "إشعياء 1:18"}, {"message": "أنا أعتني بتفاصيل حياتك الصغيرة قبل الكبيرة، فلا تشغل بالك بما سترتديه أو تأكله.", "verse": "«مُلْقِينَ كُلَّ هَمِّكُمْ عَلَيْهِ، لأَنَّهُ هُوَ يَعْتَنِي بِكُمْ»", "reference": "1 بطرس 5:7"}, {"message": "شجاعتك لا تأتي من قوتك الذاتية، بل من يقينك أنني أسير عن يمينك فلا تتزعزع.", "verse": "«أَسْتَطِيعُ كُلَّ شَيْءٍ فِي الْمَسِيحِ الَّذِي يُقَوِّينِي»", "reference": "فيلبي 4:13"}, {"message": "أعطني قلقك ومخاوفك الليلة، ونَم بسلام، فأنا لا أنعس ولا أنام.", "verse": "«بِسَلاَمَةٍ أَضْطَجِعُ بَلْ أَيْضًا أَنَامُ، لأَنَّكَ أَنْتَ يَا رَبُّ مُنْفَرِدًا فِي طُمَأْنِينَةٍ تُسَكِّنُنِي»", "reference": "مزمور 4:8"}, {"message": "تعبك في الدراسة أو العمل أو الخدمة محفوظ عندي، ومكافأتك ستأتي في حينها.", "verse": "«لأَنَّ اللهَ لَيْسَ بِظَالِمٍ حَتَّى يَنْسَى عَمَلَكُمْ وَتَعَبَ الْمَحَبَّةِ»", "reference": "عبرانيين 6:10"}, {"message": "أنا أداوي انكسار قلبك، وأجبر كل جرح سبّبته لك كلمات أو مواقف قاسية.", "verse": "«يَشْفِي الْمُنْكَسِرِي الْقُلُوبِ، وَيَجْبُرُ كَسْرَهُمْ»", "reference": "مزمور 147:3"}, {"message": "لا تجعل صوت الإحباط يعلو في ذهنك؛ اسمع صوتي الذي يهمس لك: أنا معك.", "verse": "«تَشَدَّدْ وَتَشَجَّعْ! لاَ تَرْهَبْ وَلاَ تَرْتَعِبْ لأَنَّ الرَّبَّ إِلهَكَ مَعَكَ حَيْثُمَا تَذْهَبُ»", "reference": "يشوع 1:9"}, {"message": "لقد خلقتك لهدف سامٍ، ووضعت فيك مواهب فريدة ستزهر في أوانها.", "verse": "«لأَنِّي عَرَفْتُ الأَفْكَارَ الَّتِي أَنَا مُفْتَكِرٌ بِهَا عَنْكُمْ... أَفْكَارَ سَلاَمٍ لاَ شَرّ، لأُعْطِيَكُمْ آخِرَةً وَرَجَاءً»", "reference": "إرميا 29:11"}, {"message": "حين تشتد العاصفة حول قاربك، تذكّر أنني في السفينة معك، ولن تغرق.", "verse": "«فَقَامَ وَانْتَهَرَ الرِّيحَ، وَقَالَ لِلْبَحْرِ: اسْكُتْ! ابْكَمْ! فَسَكَنَتِ الرِّيحُ وَصَارَ هُدُوءٌ عَظِيمٌ»", "reference": "مرقس 4:39"}, {"message": "حكمتي تفوق فهمك البشري؛ ثق في قيادتي حتى لو لم تفهم السبب الآن.", "verse": "«تَوَكَّلْ عَلَى الرَّبِّ بِكُلِّ قَلْبِكَ، وَعَلَى فَهْمِكَ لاَ تَعْتَمِدْ»", "reference": "أمثال 3:5"}, {"message": "أنا أفرح بك جداً، وأتهلل بترنم حين أراك تسعى لإرضائي بقلب نقي.", "verse": "«يَبْتَهِجُ بِكِ فَرَحًا. يَسْكُتُ فِي مَحَبَّتِهِ. يَبْتَهِجُ بِكِ بِتَرَنُّمٍ»", "reference": "صفنيا 3:17"}, {"message": "لا تخجل من ضعفك أمامي؛ قوتي في الضعف تُكمل، وحناني يغطيك.", "verse": "«لأَنَّنَا نَعْلَمُ أَنَّ كُلَّ الأَشْيَاءِ تَعْمَلُ مَعًا لِلْخَيْرِ لِلَّذِينَ يُحِبُّونَ اللهَ»", "reference": "رومية 8:28"}, {"message": "الأيام الصعبة التي تمر بها الآن هي التي تصقل معدنك لتكون نوراً لمن حولك.", "verse": "«فِي الْعَالَمِ سَيَكُونُ لَكُمْ ضِيقٌ، وَلكِنْ ثِقُوا: أَنَا قَدْ غَلَبْتُ الْعَالَمَ»", "reference": "يوحنا 16:33"}, {"message": "أنت لست وحيداً في معركتك؛ أنا أحفظ دخولك وخروجك.", "verse": "«الرَّبُّ حَافِظُكَ. الرَّبُّ ظِلٌّ لَكَ عَنْ يَدِكَ الْيُمْنَى»", "reference": "مزمور 121:5"}, {"message": "توقف عن جلد ذاتك على أخطاء الأمس؛ تعال إليّ وابدأ من جديد.", "verse": "«إِذًا لاَ شَيْءَ مِنَ الدَّيْنُونَةِ الآنَ عَلَى الَّذِينَ هُمْ فِي الْمَسِيحِ يَسُوعَ»", "reference": "رومية 8:1"}, {"message": "سأرد لك السنين التي أكلها الجراد، وسأملأ حياتك بثمار الفرح والتعويض.", "verse": "«وَأُعَوِّضُ لَكُمْ عَنِ السِّنِينَ الَّتِي أَكَلَهَا الْجَرَادُ»", "reference": "يوئيل 2:25"}, {"message": "ارفع عينيك عن المشكلة وانظر إليّ؛ أنا أكبر من كل التحديات التي تواجهك.", "verse": "«الرَّبُّ نُورِي وَخَلاَصِي، مِمَّنْ أَخَافُ؟ الرَّبُّ حِصْنُ حَيَاتِي، مِمَّنْ أَرْتَعِبُ؟»", "reference": "مزمور 27:1"}, {"message": "حنان الأم على رضيعها لا يُقارن بحناني عليك؛ أنا لا أنساك.", "verse": "«هَلْ تَنْسَى الْمَرْأَةُ رَضِيعَهَا فَلاَ تَرْحَمَ ابْنَ بَطْنِهَا؟ حَتَّى هؤُلاَءِ يَنْسِينَ، وَأَنَا لاَ أَنْسَاكِ»", "reference": "إشعياء 49:15"}, {"message": "لا تخف من رأي الناس فيك، يكفيك أنك مقبول ومحبوب في عينيّ.", "verse": "«انْظُرُوا أَيَّةَ مَحَبَّةٍ أَعْطَانَا الآبُ حَتَّى نُدْعَى أَوْلاَدَ اللهِ!»", "reference": "1 يوحنا 3:1"}, {"message": "أنا أعطيك روح القوة والمحبة والنصح، لا روح الفشل أو الخوف.", "verse": "«لأَنَّ اللهَ لَمْ يُعْطِنَا رُوحَ الْفَشَلِ، بَلْ رُوحَ الْقُوَّةِ وَالْمَحَبَّةِ وَالنُّصْحِ»", "reference": "2 تيموثاوس 1:7"}, {"message": "كلما ضاق بك الطريق، اقترب مني أكثر، ستجد في حضرتي سعة وراحة.", "verse": "«اقْتَرِبُوا إِلَى اللهِ فَيَقْتَرِبَ إِلَيْكُمْ»", "reference": "يعقوب 4:8"}, {"message": "أنا إله البدايات الجديدة؛ لا يوجد وضع ميؤوس منه حين تضع يدك في يدي.", "verse": "«هَا أَنَا أَصْنَعُ أَمْرًا جَدِيدًا. الآنَ يَنْبُتُ. أَلاَ تَعْرِفُونَهُ؟»", "reference": "إشعياء 43:19"}, {"message": "صوتك في التسبيح والصلاة يبهج قلبي، فلا تحرمني من الحديث معك كل يوم.", "verse": "«أَرِينِي وَجْهَكِ، أَسْمِعِينِي صَوْتَكِ، لأَنَّ صَوْتَكِ لَطِيفٌ وَوَجْهَكِ جَمِيلٌ»", "reference": "نشيد الأنشاد 2:14"}, {"message": "سأعلمك وأرشدك في الطريق التي تسلكها؛ عيني عليك دائماً لتنصحك.", "verse": "«أُعَلِّمُكَ وَأُرْشِدُكَ الطَّرِيقَ الَّتِي تَسْلُكُهَا. أَنْصَحُكَ. عَيْنِي عَلَيْكَ»", "reference": "مزمور 32:8"}, {"message": "لا تحزن على ما فقدته؛ ما أدخره لك أعظم بكثير مما تتخيله أو تطلبه.", "verse": "«مَا لَمْ تَرَ عَيْنٌ، وَلَمْ تَسْمَعْ أُذُنٌ، وَلَمْ يَخْطُرْ عَلَى بَالِ إِنْسَانٍ: مَا أَعَدَّهُ اللهُ لِلَّذِينَ يُحِبُّونَهُ»", "reference": "1 كورنثوس 2:9"}, {"message": "أنا أسيّج حولك وحول بيتك وأحبائك بسور من نار، وأكون مجداً في وسطكم.", "verse": "«وَأَنَا، يَقُولُ الرَّبُّ، أَكُونُ لَهَا سُورَ نَارٍ مِنْ حَوْلِهَا، وَأَكُونُ مَجْدًا فِي وَسَطِهَا»", "reference": "زكريا 2:5"}, {"message": "ثباتك في الحق وسط جيل متقلب هو شهادة حية تفرح قلبي وتكرم اسمي.", "verse": "«كُونُوا رَاسِخِينَ، غَيْرَ مُتَزَعْزِعِينَ، مُكْثِرِينَ فِي عَمَلِ الرَّبِّ كُلَّ حِينٍ»", "reference": "1 كورنثوس 15:58"}, {"message": "عندما تشعر بالتيه، قف واسألني، وسأكون أنا البوصلة التي تعيدك لمسارك الصحيح.", "verse": "«فِي كُلِّ طُرُقِكَ اعْرِفْهُ، وَهُوَ يُقَوِّمُ سُبُلَكَ»", "reference": "أمثال 3:6"}, {"message": "محبتي لك غير مشروطة؛ لست بحاجة لأن تتصنع الكمال لتنال رضاي.", "verse": "«لأَنَّ الرَّبَّ حَنَّانٌ وَرَحِيمٌ، طَوِيلُ الرُّوحِ وَكَثِيرُ الرَّحْمَةِ»", "reference": "مزمور 103:8"}, {"message": "أنت نور العالم وملح الأرض؛ لا تطفئ شعلة الرجاء التي وضعتها في داخلك.", "verse": "«أَنْتُمْ نُورُ الْعَالَمِ... فَلْيُضِئْ نُورُكُمْ هكَذَا قُدَّامَ النَّاسِ»", "reference": "متى 5:14، 16"}, {"message": "سأحوّل وادي البكاء الذي تعبر فيه الآن إلى ينابيع ماء وبركة.", "verse": "«عَابِرِينَ فِي وَادِي الْبُكَاءِ يُصَيِّرُونَهُ يَنْبُوعًا. أَيْضًا بِبَرَكَاتٍ يُغَطُّونَ مُورَةَ»", "reference": "مزمور 84:6"}, {"message": "استند عليّ بكل ثقلك، فأنا الصخرة الدهرية التي لا تتزعزع أبداً.", "verse": "«تَوَكَّلُوا عَلَى الرَّبِّ إِلَى الأَبَدِ، لأَنَّ فِي يَاهَ الرَّبِّ صَخْرَ الدُّهُورِ»", "reference": "إشعياء 26:4"}, {"message": "تذكر دائماً: مهما تغير كل شيء من حولك، أنا أبوك السماوي، وحبي لك باقٍ إلى الأبد.", "verse": "«يَسُوعُ الْمَسِيحُ هُوَ هُوَ أَمْسًا وَالْيَوْمَ وَإِلَى الأَبَدِ»", "reference": "عبرانيين 13:8"}];
let previous = -1;
const btn = document.getElementById('draw');
btn.addEventListener('click', () => {
  btn.disabled = true;
  let index = Math.floor(Math.random() * (cards.length - 1));
  if (index >= previous) index++;
  previous = index;
  const card = cards[index];
  document.getElementById('welcome').classList.add('hidden');
  const result = document.getElementById('result');
  result.classList.remove('hidden');
  result.style.animation = 'none';
  void result.offsetWidth;
  result.style.animation = '';
  document.getElementById('number').textContent = `رسالتك رقم ${index + 1} من 50`;
  document.getElementById('message').textContent = card.message;
  document.getElementById('verse').textContent = card.verse;
  document.getElementById('reference').textContent = card.reference;
  btn.textContent = 'اقرأ رسالة تانية ✨';
  setTimeout(() => { btn.disabled = false; }, 350);
});
</script>
